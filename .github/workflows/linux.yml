name: Linux
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb
      - name: Get verified Zig 0.14.1
        run: |
          curl -L --fail https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - name: Build and test rules
        run: ./build-linux.sh
      - name: Test GTK window
        run: timeout 60s xvfb-run -a ./complexweeper --smoke-test linux-validation --config-dir "$RUNNER_TEMP/complexweeper-test-config" --mute
      - uses: actions/upload-artifact@v5
        with:
          name: linux-validation
          path: linux-validation/
